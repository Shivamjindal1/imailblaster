{% extends 'base.html' %}

{% block title %}Change Password | imailblaster
{% endblock title %}

{% block body %}


    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">Enter New Password</div>
                    <div class="card-body">
                        <form action="/change_password/" method="post">{% csrf_token %}
                            <div class="form-group">
                                {% comment %} <label for="password">Email address</label> {% endcomment %}
                                <input type="text" name="password" class="form-control" id="password" placeholder="New Password">
                            </div>
                            <div class="form-group">
                                {% comment %} <label for="cpassword">Email address</label> {% endcomment %}
                                <input type="text" name="cpassword" class="form-control" id="cpassword" placeholder="Confirm New Password">
                            </div>
                            <button type="submit" class="btn btn-primary">Submit</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    {% endblock %}
