{% extends 'base.html' %}

{% block title %}Forgot Password | imailblaster
{% endblock title %}

{% block body %}


    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">Forgot Password</div>
                    <div class="card-body">
                        <form action="/send_otp/" method="post">{% csrf_token %}
                            <div class="form-group">
                                <label for="email">Email address</label>
                                <input type="email" name="email" class="form-control" id="email" aria-describedby="emailHelp" placeholder="example@example.com">
                                <small id="emailHelp" class="form-text text-muted">We'll send you an email with instructions to reset your password.</small>
                            </div>
                            <button type="submit" class="btn btn-primary">Submit</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    {% endblock %}
